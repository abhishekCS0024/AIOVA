services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rca}
      POSTGRES_DB: ${POSTGRES_DB:-rca}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rca}"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rca}:${POSTGRES_PASSWORD:-rca}@db:5432/${POSTGRES_DB:-rca}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
